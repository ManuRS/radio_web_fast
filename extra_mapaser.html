<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa de emisoras de la SER</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" />

  <link rel="stylesheet" href="theme-colors.css">
  <link rel="stylesheet" href="theme-aux.css">

  <style>
    body { margin: 0; padding: 0; }
    #map { height: 100vh; width: 100%; background: #111827;}

    /* Colores */
    :root {
      color-scheme: light;
      --panel-bg: rgba(255, 255, 255, 0.8);
      --panel-text: #111;
      --popup-bg: #fff;
      --popup-text: #222;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --panel-bg: rgba(17, 24, 39, 0.8);
      --panel-text: #f3f4f6;
      --popup-bg: #1f2937;
      --popup-text: #f3f4f6;
    }

    /* Panel lateral flotante */
    #panel {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 250px;
      max-width: 80%;
      background: var(--panel-bg);
      color: var(--panel-text);
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      z-index: 1000;
      font-family: Arial, sans-serif;
      transition: background 0.2s, color 0.2s;
    }

    #panel h1 {
      margin: 0;
      font-size: 18px;
      text-align: center;
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: var(--popup-bg);
      color: var(--popup-text);
    }

    .leaflet-popup-content {
      color: var(--popup-text);
    }

    .leaflet-container {
      font-family: Arial, sans-serif;
    }

    /* Ajustes para móviles */
    @media (max-width: 600px) {

      /* Cartel del título */
      #panel {
        top: 12px;
        left: 12px;
        width: 220px;
        max-width: calc(100% - 48px);
        padding: 16px;
        border-radius: 12px;
      }

      #panel h1 {
        font-size: 16px;
        line-height: 1.35;
      }

      /* Botones de zoom */
      .leaflet-control-zoom a {
        width: 44px;
        height: 44px;
        line-height: 44px;
        font-size: 28px;
      }

      /* Ventana que aparece al pulsar una emisora */
      .leaflet-popup-content {
        font-size: 16px;
        line-height: 1.6;
        margin: 16px 20px;
      }

      .leaflet-popup-content-wrapper {
        border-radius: 12px;
      }

      .leaflet-popup-content b {
        font-size: 20px;
      }

      .leaflet-popup-close-button {
        transform: scale(1.3);
        transform-origin: top right;
      }

      /* Iconos de los marcadores de las emisoras */
      .leaflet-marker-icon {
        transform-origin: center bottom;
      }

      /* Boton modo oscuro en moviles */
      .theme-toggle {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 2000;
      }

    }
    
  </style>

  <script type="importmap">
    {
      "imports": {
        "leaflet": "https://unpkg.com/leaflet/dist/leaflet-src.esm.js",
        "maplibre-gl": "https://unpkg.com/maplibre-gl/dist/maplibre-gl.mjs"
      }
    }
  </script>

</head>

<body>

  <!-- Panel lateral flotante -->
  <div id="panel">
    <h1>MAPA DE LA RED DE EMISORAS DE LA SER</h1>
  </div>

  <!-- Mapa -->
  <div id="map"></div>

  <!-- Botón modo oscuro, la posición no se define aquí -->
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Activar modo oscuro" aria-pressed="false">
    <span id="theme-label">Modo oscuro</span>
    <span id="theme-icon" aria-hidden="true">🌙</span>
  </button>

  <!-- Para el modo oscuro -->
  <script src="script-interfaz.js"></script>

  <!-- El mapa -->
  <script type="module">

    import * as L from 'leaflet';
    import * as maplibregl from 'maplibre-gl';

    import {maplibreGL} from 'https://unpkg.com/@maplibre/maplibre-gl-leaflet/dist/leaflet-maplibre-gl.mjs';

    const ESTILOS = {
      light: 'https://tiles.openfreemap.org/styles/positron',
      dark:  'https://tiles.openfreemap.org/styles/dark'
    };

    // Tema guardado por el resto de la web.
    function obtenerTemaGuardado() {
      try {
        return localStorage.getItem('radio-page-theme') === 'dark' ? 'dark' : 'light';
      } catch (error) {
        return 'light';
      }
    }

    let temaActual = obtenerTemaGuardado();
    document.documentElement.dataset.theme = temaActual;

    // Crear mapa Leaflet.
    const map = L.map('map', {
      minZoom: 4,
      maxZoom: 14,
      zoomControl: false
    }).setView(
      [40.0, -3.8],
      window.matchMedia('(max-width: 600px)').matches ? 6 : 7
    );

    L.control.zoom({
      position: 'topright'
    }).addTo(map);

    // Añadir el mapa vectorial como una capa de Leaflet.
    const capaMapa = maplibreGL(
      { style: ESTILOS[temaActual] },
      { attribution: 'OpenFreeMap &copy; OpenMapTiles &copy; Datos de OpenStreetMap &copy;' }
    ).addTo(map);

    // Cambiar el estilo sin recrear el mapa ni sus marcadores.
    function aplicarTemaMapa(tema) {
      temaActual = tema === 'dark' ? 'dark' : 'light';
      document.documentElement.dataset.theme = temaActual;
      const mapaGL = capaMapa.getMaplibreMap();
      if (mapaGL) {
        mapaGL.setStyle(ESTILOS[temaActual]);
      }
    }

    // Detectar cambios del tema desde otras pestañas.
    window.addEventListener('radio-theme-change', function(event) {
      aplicarTemaMapa(event.detail.theme);
    });

    // Descargar el json eliminando los comentarios
    const textoLimpio = await fetch('https://raw.githubusercontent.com/ManuRS/radio_web_fast/refs/heads/main/extra_emisorasser.json')
    .then(r => r.text())
    .then(texto => texto.replace(/\/\/.*$/gm, '')); 

    // Parsear el json
    const emisoras = JSON.parse(textoLimpio);

    // Tamaño de los marcadores en móviles
    const esMovil = window.matchMedia('(max-width: 600px)').matches;
    const escalaMarcador = esMovil ? 1.5 : 1;

    // Añadir marcadores y ventanas emergentes.
    emisoras.forEach(function(emisora) {
    const contenido = document.createElement('div');
    const nombre = document.createElement('b');

    nombre.textContent = emisora.nombre;
    contenido.appendChild(nombre);
    contenido.appendChild(document.createElement('br'));
    contenido.appendChild(document.createTextNode(emisora.ciudad));
    contenido.appendChild(document.createElement('br'));
    contenido.appendChild(
      document.createTextNode('Frecuencia: ' + emisora.frecuencia)
    );

    const marcador = L.marker([emisora.lat, emisora.lon]).addTo(map);

    if (escalaMarcador > 1) {
      marcador.on('add', function() {
        const icono = marcador.getElement();
        if (icono) {
          icono.style.transform += ' scale(' + escalaMarcador + ')';
        }
      });
    }

    marcador.bindPopup(contenido);

  });

  </script>

</body>
</html>
