<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f0f4ff" id="theme-color-meta">
  <title>Pódcast en línea</title>

  <script src="script-fastload.js"></script>

  <link rel="stylesheet" href="theme-colors.css">
  <link rel="stylesheet" href="theme-podcast.css">
  <link rel="stylesheet" href="theme-aux.css">

</head>

<body>

  <h1>Pódcast en línea<br><br></h1>

  <!-- Control de volumen, define su posición -->
  <div class="volume-control">
    <input type="range" id="volume-slider" min="0.001" max="1" step="any" value="1">
  </div>

  <!-- Botón modo oscuro, la posición no se define aquí -->
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Activar modo oscuro" aria-pressed="false">
    <span id="theme-label">Modo oscuro</span>
    <span id="theme-icon" aria-hidden="true">🌙</span>
  </button>

  <!-- Modal salir, la posición no se define aquí -->
  <div id="exit-modal" class="modal">
    <div class="modal-content">
      <p><b>Pulsa atrás / desliza de nuevo para salir</b></p>
      <div class="buttons">
        <button id="stay-btn">Seguir en la página</button>
      </div>
    </div>
  </div>

  <br><br>

  <div id="lista"></div>

  <script src="script-logica.js"></script>
  <script src="script-interfaz.js"></script>
  <script src="script-cargarss.js"></script>

  <script>

    const podcasts = [

      { nombre: "Boletín RNE", url: "https://api.rtve.es/api/adapter/programas/1750/audios.rss", capitulo: ["00H"] },
      { nombre: "Boletín Onda Cero", url: "https://www.ondacero.es/rss/podcast/triton/mount/ATRESMEDIA_LAS_NOTICIAS_EN_ONDA_CERO_AOD_P/origin/fastly", capitulo: ["Las noticias de Onda Cero"] },

      { nombre: "Mediodía en RNE", url: "https://api.rtve.es/api/adapter/programas/1001380/audios.rss", capitulo: ["Mediodía en RNE - "] },
      { nombre: "Mediodía COPE", url: "https://www.cope.es/api/es/programas/mediodia-cope/audios/rss.xml", capitulo: ["14:00H"] },
      { nombre: "Noticias Mediodía en Onda Cero", url: "https://www.ondacero.es/rss/podcast/triton/mount/ATRESMEDIA_NOTICIAS_MEDIODIA_AOD_P/origin/fastly", capitulo: ["Noticias mediodía "] },

      { nombre: "RNE 24 Horas - Informativo", url: "https://api.rtve.es/api/adapter/programas/1871/audios.rss", capitulo: ["24 Horas - Informativo"] },
      { nombre: "La Linterna 20H", url: "https://www.cope.es/api/es/programas/la-linterna/audios/rss.xml", capitulo: ["20:00H"] },

      { nombre: "La Brújula Portada", url: "https://www.ondacero.es/rss/podcast/triton/mount/ATRESMEDIA_LA_BRUJULA_AOD_P/origin/fastly", capitulo: ["La portada "] },
      { nombre: "La Brújula Corresponsales", url: "https://www.ondacero.es/rss/podcast/triton/mount/ATRESMEDIA_LA_BRUJULA_AOD_P/origin/fastly", capitulo: ["Corresponsales: "] },

    ];

    cargarRSS_bycaps(podcasts, "personalizado_antiguedad_titulo", imagen_type="general");

  </script>

</body>
</html>
