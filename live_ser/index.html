<!DOCTYPE html>
<html lang="es" data-page="index">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <link rel="icon" href="../resources/favicon3.ico" type="image/x-icon">
  <link rel="shortcut icon" href="../resources/favicon3.ico" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="192x192" href="../resources/icon3-192.png">
  <link rel="apple-touch-icon" href="../resources/icon3-192.png">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f6f6f6" id="theme-color-meta">

  <title>Radio Web Fast SER: el micro amarillo a un toque</title>

  <meta name="description" content="La mejor opción para escuchar la SER sin lios de manera rápida y sencilla">
  <link rel="canonical" href="https://radiofast.pages.dev/live_ser/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Radio Web Fast SER: el micro amarillo a un toque">
  <meta property="og:description" content="La mejor opción para escuchar la SER sin lios de manera rápida y sencilla">
  <meta property="og:url" content="https://radiofast.pages.dev/live_ser/">
  <meta property="og:site_name" content="Radio Web Fast SER">
  <meta property="og:locale" content="es_ES">
  <meta property="og:image" content="https://radiofast.pages.dev/resources/og-radio.jpg?v=10">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Radio Web Fast: icono de la app en fondo azul violeta, con el texto «Escucha la radio de manera fácil y rápida. Sin cookies, rastreos ni anuncios»">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Schema.org -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Radio Web Fast SER",
    "description": "La mejor opción para escuchar la SER sin lios de manera rápida y sencilla",
    "url": "https://radiofast.pages.dev/live_ser/",
    "image": "https://radiofast.pages.dev/resources/og-radio.jpg?v=10",
    "applicationCategory": "MultimediaApplication",
    "operatingSystem": "All",
    "inLanguage": "es",
    "browserRequirements": "Requiere JavaScript",
    "isAccessibleForFree": true,
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
  }
  </script>

  <script src="../js/script-fastload.js"></script>
  <script src="../js/script-stats.js"></script>
  <script src="../js/script-instalar.js"></script>

  <link rel="stylesheet" href="../css/theme-colors.css">
  <link rel="stylesheet" href="../css/theme-podcast.css">
  <link rel="stylesheet" href="../css/theme-aux.css">

  <link rel="stylesheet" href="../css/theme-cards.css">

  <style>
    /* Fondos personalizados */
    .cadena-ser::before { background-image: url('../resources/micro.jpg'); }

    .card { height: 400px; }

    @media (max-width: 42em) {
      body:not(:has(#category-buttons)) .card {
        height: 300px;
      }
    }

  </style>

</head>
<body>

<h1>La SER en directo</h1>

<!-- Control de volumen, define su posición -->
<div class="volume-control">
  <input type="range" id="volume-slider" min="0.001" max="1" step="any" value="1">
</div>

<!-- Botón modo oscuro, la posición no se define aquí -->
<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Activar modo oscuro" aria-pressed="false">
  <span id="theme-label">Modo oscuro</span>
  <span id="theme-icon" aria-hidden="true">🌙</span>
</button>

<!-- Modal de salida: botón atrás tras dar al play (ver script-interfaz.js) -->
<dialog id="exit-modal" class="info-dialog" aria-labelledby="exit-title">
  <div class="modal-content info-content">
    <button type="button" class="info-close" id="exit-close" aria-label="Cerrar">✕</button>
    <div class="info-head">
      <img src="../resources/icon2-192.png" alt="" width="28" height="28">
      <h2>Radio Web Fast</h2>
    </div>
    <p class="exit-q" id="exit-title">¿Salir y parar la radio?</p>
    <p class="exit-note" id="exit-note">Para seguir escuchando, minimiza la app con el botón de inicio</p>
    <div class="exit-actions">
      <button type="button" id="exit-cancel" autofocus>Cancelar</button>
      <button type="button" id="exit-go" class="primario">Sí, salir</button>
    </div>
  </div>
</dialog>

<div class="links" id="lista">

  <!-- Cadena SER -->
  <div class="card cadena-ser general" onclick="playPause(this)">
    <div class="card-content">
      <span class="station-name">Cadena SER</span>
      <span class="live-indicator">Escuchando</span>
    </div>
    <audio data-src="https://playerservices.streamtheworld.com/api/livestream-redirect/CADENASER.mp3" data-eq="true"></audio>
  </div>

</div>

<script src="../js/script-interfaz.js"></script>
<script src="../js/script-eventos.js"></script>
<script src="../js/script-serviceworker.js"></script>

<script src="../js/script-ecualizador.js"></script>
<script src="../js/script-livesound.js"></script>

</body>
</html>
