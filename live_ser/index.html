<!DOCTYPE html>
<html lang="es" data-page="index">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <link rel="icon" href="../resources/favicon3.ico" type="image/x-icon">
  <link rel="shortcut icon" href="../resources/favicon3.ico" type="image/x-icon">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f6f6f6" id="theme-color-meta">

  <title>Radio en directo</title>

  <script src="../script-fastload.js"></script>

  <link rel="stylesheet" href="../theme-colors.css">
  <link rel="stylesheet" href="../theme-podcast.css">
  <link rel="stylesheet" href="../theme-aux.css">

  <link rel="stylesheet" href="../theme-cards.css">

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    /* Fondos personalizados */
    .cadena-ser::before { background-image: url('../resources/micro.jpg'); }

    .card { height: 400px; }

    @media (max-width: 42em) {
      body:not(:has(#category-buttons)) .card {
        height: 300px;
      }
    }

  </style>

</head>
<body>

<h1>Radio en directo</h1>

<!-- Control de volumen, define su posición -->
<div class="volume-control">
  <input type="range" id="volume-slider" min="0.001" max="1" step="any" value="1">
</div>

<!-- Botón modo oscuro, la posición no se define aquí -->
<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Activar modo oscuro" aria-pressed="false">
  <span id="theme-label">Modo oscuro</span>
  <span id="theme-icon" aria-hidden="true">🌙</span>
</button>

<!-- Modal salir, la posición no se define aquí -->
<div id="exit-modal" class="modal">
  <div class="modal-content">
    <p><b>Pulsa atrás / desliza de nuevo para salir</b></p>
    <div class="buttons">
      <button id="stay-btn">Seguir en la página</button>
    </div>
  </div>
</div>

<div class="links" id="lista">

  <!-- Cadena SER -->
  <div class="card cadena-ser general" onclick="playPause(this)">
    <div class="card-content">
      <span class="station-name">Cadena SER</span>
      <span class="live-indicator">Escuchando</span>
    </div>
    <audio data-src="https://playerservices.streamtheworld.com/api/livestream-redirect/CADENASER.mp3"></audio>
  </div>

</div>

<script src="../script-interfaz.js"></script>
<script src="../script-eventos.js"></script>
<script src="../script-serviceworker.js"></script>

<script src="../script-livesound.js"></script>

</body>
</html>
