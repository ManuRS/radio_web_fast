<!DOCTYPE html>
<html lang="es" data-page="index">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <link rel="icon" href="../resources/favicon2.ico" type="image/x-icon">

  <meta name="theme-color" content="#f6f6f6" id="theme-color-meta">

  <script src="../script-fastload.js"></script>

  <link rel="stylesheet" href="../theme-colors.css">
  <link rel="stylesheet" href="../theme-podcast.css">
  <link rel="stylesheet" href="../theme-aux.css">

  <link rel="stylesheet" href="../theme-cards.css">

  <style>

    html, body { **overflow: hidden; **touch-action: none; }

    /* Emisora de música seleccionada: su texto en negrita */
    .buttonExtraBol[data-music] { font-weight: 400; }
    .buttonExtraBol[data-music][aria-pressed="true"] { font-weight: 700; }

  </style>

</head>

<body>

  <h1>Solo boletines en directo</h1>

  <!-- Botón modo oscuro, la posición no se define aquí -->
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Activar modo oscuro" aria-pressed="false" style="margin: 0;">
    <span id="theme-label">Modo oscuro</span>
    <span id="theme-icon" aria-hidden="true">🌙</span>
  </button>

  <!-- Modal salir, la posición no se define aquí -->
  <div id="exit-modal" class="modal">
    <div class="modal-content">
      <p><b>Pulsa atrás / desliza de nuevo para salir</b></p>
      <div class="buttons">
        <button id="stay-btn">Seguir en la página</button>
      </div>
    </div>
  </div>

  <!-- Imagen emisora sonando -->
  <div style="width: 100%; text-align: center; margin-bottom: 20px; margin-top: 25px;">
    <img id="logo-emisora" alt="Logo Emisora" style="height: 60px; object-fit: contain; transition: opacity 0.3s;">
  </div>
  
  <!-- Visualizador --> 
  <canvas id="visualizer" style="height: 80px; margin-bottom: 25px; margin-top: 5px;"></canvas>

  <!-- Reproductor oculto -->
  <div id="live_news" hidden><audio id="radio_news" style="display:none;"></audio></div>
  <audio id="radio_prep" style="display:none;"></audio>
  <div id="live_music" hidden><audio id="radio_music" style="display:none"></audio></div>

  <!-- Sliders para el volumen -->
  <div id="status_news" class="status">Volumen noticias</div><br>
  <input type="range" id="radio_news_volume" class="volume-style" min="0" max="1" step="0.01" value="1"><br>

  <div id="status_music" class="status">Volumen música</div><br>
  <input type="range" id="radio_music_volume" class="volume-style" min="0" max="1" step="0.01" value="0.5"><br>

  <!-- Botón de reproducción único -->
  <button id="playButton">Algo ha salido mal</button><br>

  <!-- Enlaces para la música -->
  <div id="status_modo_musica" class="status">Cargar modo música</div><br>

  <!-- Botones para modo música -->

  <div style="display: inline-flex; gap: 10px; align-items: center; font-size: 1rem;">
    <a href="?music=2" class="buttonExtraBol" data-music="2">LOS40</a>
    <a href="?music=3" class="buttonExtraBol" data-music="3">CLASSIC</a>
    <a href="?music=4" class="buttonExtraBol" data-music="4">MEGASTAR</a>
  </div><br>

  <!-- Botones para modo música -->
  <div style="display: inline-flex; gap: 10px; align-items: center; font-size: 1rem;">
    <a href="?music=5" class="buttonExtraBol" data-music="5">ROCKFM</a>
    <a href="?music=6" class="buttonExtraBol" data-music="6">HITFM</a>
    <a href="?music=1" class="buttonExtraBol" data-music="1">SOLO NOTICIAS</a>
  </div> <br>

  <!-- Reloj -->
  <div class="time" id="officialTime"></div>
  <div class="time" id="deviceTime"></div>
  <div class="time" id="offsetTime"></div>

  <script src="../script-interfaz.js"></script>
  <script src="../script-eventos.js"></script>
  <script src="../script-livesound.js"></script>
  <script src="script-extrabol.js"></script>

<script>

  /*====================*/
  /*==   JAVASCRIPT   ==*/
  /*====================*/

  /*====================================================================*/
  /*==  AJUSTES DE TIEMPO  (lo que hay que tocar para afinar)          ==*/
  /*====================================================================*/

  // >>> RETRASO DEL STREAM DE INTERNET RESPECTO A LA EMISIÓN REAL (segundos) <<<
  // Lo que se oye por internet sale esta cantidad de segundos más tarde que en
  // una emisión FM o en el estudio. Los horarios de horariosPermitidos son horas
  // REALES de emisión; las noticias entran en este stream cuando esa hora ya
  // "está sonando" aquí, es decir, a (hora + RETRASO_STREAM_S).
  const RETRASO_STREAM_S = 32;

  // Las noticias se conectan en silencio (volumen mínimo) esto ANTES de que entren.
  // Mantiene despierta la pestaña: Chrome, si no suena nada, solo llama a la página
  // una vez por minuto (en un segundo cualquiera). Para asegurar que esa llamada cae
  // dentro del margen hace falta 60 s más el tiempo que necesita la secuencia
  // (conectar, fade out de música, pin). Con 90 s, en el peor caso quedan 30 s.
  const conexion_previa_s = 90;

  // Antelación respecto al momento en que entran las noticias
  const antelacion_pin_s = 3.0;           // pin de entrada a noticias (desco_ini)
  const antelacion_fade_musica_s = 4.0;   // empieza el fade out de la música

  // Al volver a la música: cuántos segundos ANTES del instante que fija
  // select_random_desco_fin() empieza a entrar. 0 = justo en ese instante.
  const musica_adelanto_s = 0.0;

  // Volumen de las transiciones = volumen del destino, por un factor
  const ganancia_pin_a_noticias = 1.0;    // música -> noticias (sobre el volumen de noticias)
  const ganancia_pin_a_musica = 1.0;      // noticias -> música (sobre el volumen de música)

  /*====================================================================*/

  const audio_news = document.getElementById('radio_news');
  const audio_prep = document.getElementById('radio_prep');
  const audio_music = document.getElementById('radio_music');

  const btn = document.getElementById('playButton');
  const imgLogo = document.getElementById('logo-emisora');

  let semaforo, interval;
  let noticiasEnCurso = false;   // desde que la música empieza a cortarse hasta que acaban las noticias
  let fadeAudio_ID, fadeMusic_ID;

  let max_news_volume = 1.0;
  let max_music_volume = 0.5;

  // Cada stream tiene su propia instancia de script-livesound.js: reconexión,
  // watchdog, traspaso entre dos <audio> y pausa/play de la notificación.
  // La lógica de cuándo suena cada uno sigue siendo la de esta página.
  const card_news  = document.getElementById('live_news');
  const card_music = document.getElementById('live_music');

  // La notificación solo puede reanudar el stream que toca ahora
  const liveNews  = createLiveSound({ shouldResume: () => semaforo === true });
  const liveMusic = createLiveSound({ shouldResume: () => !noticiasEnCurso && musicURL != "none" });

  liveNews.bindAudioEvents(audio_news);
  liveMusic.bindAudioEvents(audio_music);

  /*============================*/
  /*==  STREAMS Y EMISORAS    ==*/
  /*============================*/

  // Stream noticias
  let streamURL = "https://playerservices.streamtheworld.com/api/livestream-redirect/CADENASER.mp3";

  const imgLogo_news = "../resources/live/ser.png";
  const imgLogo_pin = "../resources/live/pin.png";
  const imgLogo_off = "../resources/live/off.png";
  imgLogo.src = imgLogo_off;

  // Emisoras de música seleccionables desde los botones ("1" = modo sin música)
  const EMISORAS_MUSICA = {
    "1": { url: "none" },
    "2": { url: "https://playerservices.streamtheworld.com/api/livestream-redirect/LOS40.mp3", logo: "../resources/live/los40.png" },
    "3": { url: "https://playerservices.streamtheworld.com/api/livestream-redirect/LOS40_CLASSIC.mp3", logo: "../resources/live/classic.png" },
    "4": { url: "https://megastar-cope-rrcast.flumotion.com/cope/megastar.mp3", logo: "../resources/live/megastar.png" },
    "5": { url: "https://rockfm-cope-rrcast.flumotion.com/cope/rockfm.mp3", logo: "../resources/live/rockfm.png" },
    "6": { url: "https://hitfm.kissfmradio.cires21.com/hitfm.mp3", logo: "../resources/live/hitfm.png" }
  };

  let musicId = "1";        // emisora aplicada
  let musicIdPedido = "1";  // última emisora pedida (puede estar a media transición)
  let musicURL = "none";
  let imgLogo_music;

  // Aplica una emisora: variables, URL en los <audio>, slider, textos y botones.
  // No toca el sonido (de eso se encarga cambiarMusica).
  function seleccionarMusica(id) {
    const emisora = EMISORAS_MUSICA[id];
    musicId = id;
    musicURL = emisora.url;
    imgLogo_music = emisora.logo;

    // La librería lee la URL del data-src del <audio> que tenga en ese momento
    // (el original o el de relevo), así que se pone en todos los de la tarjeta.
    card_music.querySelectorAll('audio').forEach(a => {
      if (musicURL != "none") a.setAttribute('data-src', musicURL);
      else a.removeAttribute('data-src');
    });

    document.getElementById('radio_music_volume').disabled = (musicURL == "none");
    document.getElementById('status_music').textContent = (musicURL == "none") ? "Modo sin música" : "Volumen música";

    document.querySelectorAll('[data-music]').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.music === id));
    });
  }

  /* URL de las noticias */
  console.log(streamURL);
  audio_news.setAttribute('data-src', streamURL);

  // Selección inicial: la del parámetro ?music= si viene (accesos directos antiguos), si no, sin música
  const musicInicial = new URLSearchParams(window.location.search).get("music");
  seleccionarMusica(EMISORAS_MUSICA[musicInicial] ? musicInicial : "1");
  musicIdPedido = musicId;

  /*================*/
  /*==  HORARIOS  ==*/
  /*================*/

  // Horas REALES de emisión (como en el estudio o en una FM). Empiezan antes de las XX:00
  // para captar la aproximación y los pitos. Aquí NO se suma el retraso del stream.
  const horariosPermitidos = [
    { inicio: "07:59:44", fin: "08:20:18" },
    { inicio: "08:59:44", fin: "09:04:26" },
    { inicio: "09:59:44", fin: "10:05:55" },
    { inicio: "10:59:44", fin: "11:05:55" },
    { inicio: "11:59:44", fin: "12:20:18" },
    { inicio: "12:59:44", fin: "13:06:30" },
    { inicio: "13:59:44", fin: "14:06:26" },
    { inicio: "15:59:44", fin: "16:05:25" },
    { inicio: "16:59:44", fin: "17:05:25" },
    { inicio: "17:59:44", fin: "18:05:25" },
    { inicio: "18:59:44", fin: "19:04:32" },
    { inicio: "19:59:44", fin: "20:25:18" },
  ];

  /*=================================*/
  /*== FUNCIONES AUXILIARES SONIDO ==*/
  /*=================================*/

  // Fade in
  function fadeInVol(audioToFade, interval_ID, max_volume) {
    let suma = 0.06
    if (audioToFade.volume+suma < max_volume){
      audioToFade.volume += suma;
    }else{
      /*Hemos terminado*/
      audioToFade.volume = max_volume;
      clearInterval(interval_ID);
    }
  }

  // Fade out
  function fadeOutVol(audioToFade, interval_ID, alTerminar) {
    let resta = 0.06
    if (audioToFade.volume-resta > 0.0){
      audioToFade.volume -= resta;
    }else{
      /*Hemos terminado*/
      audioToFade.volume = 0.0;
      audioToFade.hold();
      clearInterval(interval_ID);
      if (alTerminar) alTerminar();
    }
  }

  // Pin de inicio de desconexión
  function desco_ini(){
    imgLogo.src = imgLogo_pin;
    audio_prep.volume = ganancia_pin_a_noticias*max_news_volume;
    audio_prep.src = "../sounds/desco_ini_gen.mp3";
    audio_prep.play();
  }

  // Pin de fin de desconexión
  function desco_fin(){
    imgLogo.src = imgLogo_pin;
    // Destino música; si no hay música, queda el nivel de siempre sobre las noticias
    audio_prep.volume = (musicURL != "none") ? ganancia_pin_a_musica*max_music_volume : 0.7*max_news_volume;
    audio_prep.play();
  }

  // Función auxiliar
  function select_random_desco_fin(){
    let num_random_1 = Math.floor(Math.random() * 3);
    let num_random_2 = Math.floor(Math.random() * 4);

    if (musicId === "2" && num_random_1 == 0) {
      audio_prep.src = "../sounds/los40_a.mp3";
      return 32;
    } else if (musicId === "2" && num_random_1 == 1) {
      audio_prep.src = "../sounds/los40_b.mp3";
      return 28;
    } else if (musicId === "3" && num_random_1 !== 0) {
      audio_prep.src = "../sounds/los40c_a.mp3";
      return 10;
    } else if (num_random_2 == 0) {
      audio_prep.src = "../sounds/cortinilla_conversacion.mp3";
      return 15;
    } else if (num_random_2 == 1) {
      audio_prep.src = "../sounds/claim_corto.mp3";
      return 6;
    } else if (num_random_2 == 2) {
      audio_prep.src = "../sounds/radio_madrid.mp3";
      return 9;
    } else {
      audio_prep.src = "../sounds/desco_fin_hxh.mp3";
      return 5;
    }
  }

  // Pin generico
  function pin(){
    audio_prep.src = "../sounds/pin_noid.mp3";
    audio_prep.play();
  }

  /*=======================*/
  /*== FUNCION DIRECTORA ==*/
  /*=======================*/ 
  function actualizarReproduccion(safeMode=false) {

    const ventana = ventanaNoticias(ahoraOficialMs());
    const enHorario = ventana !== null;

    if (enHorario && !semaforo && safeMode) {
      /** CARGA - PERIODO DE REPRODUCCIÓN **/

      // Noticias play
      play_news();
      
      // Intervalos rápidos
      clearInterval(interval);
      interval = setInterval(actualizarReproduccion, 1.0 * 1000);

    } else if (enHorario && !semaforo) {
      /** PERIODO DE REPRODUCCIÓN **/

      // Segundos que faltan para que entren las noticias (negativo: ya deberían estar sonando)
      const delaysecs = (ventana.entradaMs - ahoraOficialMs()) / 1000;

      // Noticias play
      play_news(delaysecs * 1000);

      if (delaysecs - antelacion_pin_s > 0) {
        /// Fade out música + pin
        stop_music( (delaysecs - antelacion_fade_musica_s) * 1000 );
        setTimeout( () => { desco_ini(); }, (delaysecs - antelacion_pin_s) * 1000 );
      } else {
        // No da tiempo, paro musica
        stop_music();
      }

      // Intervalos rápidos
      clearInterval(interval);
      interval = setInterval(actualizarReproduccion, 1.0 * 1000);

    } else if (!enHorario && semaforo && safeMode) {
      /** CARGA - PERIODO DE ESPERA **/

      // Música play
      play_music();

      // Otros
      semaforo = false;
      btn.style.background = '#1a73e8';
      btn.textContent = "Fuera del horario de noticias";
      console.log("Transmisión desactivada");

      // Intervalos relajados
      console.log("== 3. Iniciando bucle ==");
      interval = setInterval(actualizarReproduccion, 20.0 * 1000);     

    } else if (!enHorario && semaforo) {
      /** PERIODO DE ESPERA **/

      // Noticias stop
      stop_news();

      // Pin desco. La música conecta ya (en silencio) y entra sobre la cortinilla:
      // select_random_desco_fin() devuelve el instante de entrada; musica_adelanto_s lo adelanta
      let t_desco_ini_aux = select_random_desco_fin();
      setTimeout(() => { desco_fin();}, 2.0 * 1000);
      play_music( Math.max(0, t_desco_ini_aux - musica_adelanto_s) * 1000 );

      // Otros          
      semaforo = false;
      btn.style.background = '#1a73e8';
      btn.textContent = "Fuera del horario";
      console.log("Transmisión desactivada");

      // Intervalos relajados
      clearInterval(interval);
      interval = setInterval(actualizarReproduccion, 20.0 * 1000);

    } 
  }

  /*===========================*/
  /*==   PLAY / STOP AUDIO   ==*/
  /*===========================*/

  /* Esperar a que un stream suene de verdad */
  function cuandoSuene(live, accion) {
    const audio = live.currentAudio;
    if (audio && !audio.paused && audio.readyState >= 3) {
      accion();
      return () => {};
    }
    const escucha = (e) => {
      if (e.target !== live.currentAudio) return;
      document.removeEventListener('playing', escucha, true);
      accion();
    };
    document.addEventListener('playing', escucha, true);   // los eventos de audio no burbujean
    return () => document.removeEventListener('playing', escucha, true);
  }

  // Programa una entrada con fade in: espera "delay" ms y luego, si el stream aún no suena, a que suene.
  function programarEntrada(live, delay, alEntrar, alSonar) {
    let cancelaEspera = () => {};
    const t = setTimeout(() => {
      alEntrar();
      cancelaEspera = cuandoSuene(live, alSonar);
    }, delay);
    return () => { clearTimeout(t); cancelaEspera(); };
  }

  /* Reproducir noticias */
  let cancelaEntradaNoticias = () => {};
  function play_news(delay=0) {

    liveNews.volume = 0.01;
    liveNews.startLive(card_news);

    semaforo = true;

    if (delay>0.0){
      // Otros cuando hay delay
      btn.style.background = 'brown';
      btn.textContent = "Transmisión de noticias preparada";
      console.log("Transmisión preparada");
    } 
 
    cancelaEntradaNoticias();
    cancelaEntradaNoticias = programarEntrada(liveNews, delay,
      () => {
        // Llega la hora
        noticiasEnCurso = true;
        imgLogo.src = imgLogo_news;
        btn.style.background = 'green';
        btn.textContent = "Trasmitiendo noticias en directo";
        console.log("Transmisión activada");
      },
      () => {
        // Ya suena: fade in
        clearInterval(fadeAudio_ID);
        fadeAudio_ID = setInterval(() => {fadeInVol(liveNews, fadeAudio_ID, max_news_volume);}, 100);
      }
    );

  }

  /* Parar noticias */
  function stop_news(){
    cancelaEntradaNoticias();
    noticiasEnCurso = false;
    clearInterval(fadeAudio_ID);
    fadeAudio_ID = setInterval(() => {fadeOutVol(liveNews, fadeAudio_ID);}, 150);
  }

  /* Logo de lo que suena en el turno de la música */
  function mostrarLogoMusica() {
    if (musicURL != "none") {
      imgLogo.src = imgLogo_music;
      imgLogo.classList.add('logo-sonando');
    } else {
      imgLogo.src = imgLogo_off;
      imgLogo.classList.remove('logo-sonando');
    }
  }

  /* Reproducir música: conecta ya, en silencio, y entra con fade in pasado "delay" ms */
  let cancelaEntradaMusica = () => {};
  function play_music(delay=0) {
    if (musicURL != "none"){
      liveMusic.volume = 0.01;
      liveMusic.startLive(card_music);

      cancelaEntradaMusica();
      cancelaEntradaMusica = programarEntrada(liveMusic, delay,
        mostrarLogoMusica,
        () => {
          clearInterval(fadeMusic_ID);
          fadeMusic_ID = setInterval(() => {fadeInVol(liveMusic, fadeMusic_ID, max_music_volume);}, 300);
        }
      );
    }
  }

  /* Parar música */
  function stop_music(delay=0) {
    if (musicURL != "none"){
      // Para con delay opcional
      setTimeout(() => {
        noticiasEnCurso = true;
        cancelaEntradaMusica();
        imgLogo.classList.remove('logo-sonando');
        clearInterval(fadeMusic_ID);
        fadeMusic_ID = setInterval(() => {fadeOutVol(liveMusic, fadeMusic_ID);}, 100);
      }, delay);
    }
  }

  /* Cambiar de emisora de música sin recargar: fade out, cambio de stream y fade in */
  function cambiarMusica(id) {
    if (!EMISORAS_MUSICA[id] || id === musicIdPedido) return;
    musicIdPedido = id;

    // Resalta ya el botón pulsado
    document.querySelectorAll('[data-music]').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.music === id));
    });

    const habia_musica = !!liveMusic.currentAudio;
    cancelaEntradaMusica();

    const aplicar = () => {
      seleccionarMusica(id);
      if (semaforo !== undefined && !noticiasEnCurso) {
        // Es el turno de la música: el logo cambia ya y entra la nueva (o silencio)
        mostrarLogoMusica();
        if (musicURL != "none") play_music();
      }
      // Si van noticias (o aún no se ha pulsado el botón), solo queda elegida
      // para cuando vuelva la música.
    };

    if (habia_musica) {
      imgLogo.classList.remove('logo-sonando');
      clearInterval(fadeMusic_ID);
      fadeMusic_ID = setInterval(() => {fadeOutVol(liveMusic, fadeMusic_ID, aplicar);}, 100);
    } else {
      aplicar();
    }
  }

  document.querySelectorAll('[data-music]').forEach(b => {
    b.addEventListener('click', (e) => {
      e.preventDefault();
      cambiarMusica(b.dataset.music);
    });
  });

  /*===========================*/
  /*==    MAIN FUNCTION      ==*/
  /*===========================*/
  function main_function () {
    console.log("== 1. Definiendo semaforo ==");
    semaforo = ventanaNoticias(ahoraOficialMs()) ? false : true;
    console.log("Semaforo " + semaforo);

    console.log("== 2. Comprobación inicial ==");
    actualizarReproduccion(true);  
  }

  /*===========================*/
  /*==  INTERACCIÓN USUARIO  ==*/
  /*===========================*/
  btn.textContent = "Haz click aquí para otorgar permisos";
  btn.addEventListener('click', () => {
    setTimeout(() => { setupVisualizer(); }, 0);
    setTimeout(() => { pin(); }, 0);
    setTimeout(() => { main_function(); }, 0);
  },{once:true});
  
  /*===========================*/
  /*==     BOUNCE EFFECT     ==*/
  /*===========================*/
  imgLogo.addEventListener('animationiteration', () => {
      const randomScale = (Math.random() * (1.5 - 1.15) + 1.15).toFixed(2);
      imgLogo.style.setProperty('--bounce-scale', randomScale);
  });

  // Iniciar
  obtenerHoraOficial();
  // Actualizar cada segundo
  setInterval(actualizarRelojes, 1000);
  // Refrescar hora oficial dos minuto
  setInterval(obtenerHoraOficial, 2*60000);

</script>

</body>
</html>
