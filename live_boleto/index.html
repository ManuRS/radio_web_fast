<!DOCTYPE html>
<html lang="es" data-page="index">
<head>
  <meta charset="UTF-8">

<body>

  <!-- Imagen emisora sonando -->

  <!-- Sliders para el volumen -->

  <input type="range" id="radio_news_volume" class="volume-style" min="0" max="1" step="0.01" value="1"><br>

  <div id="status_music" class="status">Volumen música</div><br>
  <input type="range" id="radio_music_volume" class="volume-style" min="0" max="1" step="0.01" value="0.5"><br>

  <!-- Botón de reproducción único -->
  <button id="playButton">Algo ha salido mal</button><br>

  <!-- Enlaces para la música -->
  <div id="status_news" class="status">Cargar modo música</div><br>

  <!-- Botones para modo música -->

  <div style="display: inline-flex; gap: 10px; align-items: center; font-size: 1rem;">
    <a href="?music=2" class="buttonExtraBol">LOS40</a>
    <a href="?music=3" class="buttonExtraBol">CLASSIC</a>
    <a href="?music=4" class="buttonExtraBol">MEGASTAR</a>
  </div><br>

  <!-- Botones para modo música -->
  <div style="display: inline-flex; gap: 10px; align-items: center; font-size: 1rem;">
    <a href="?music=5" class="buttonExtraBol">ROCKFM</a>
    <a href="?music=6" class="buttonExtraBol">HITFM</a>
    <a href="?music=1" class="buttonExtraBol">SOLO NOTICIAS</a>
  </div> <br>

  <!-- Reloj -->
  <div class="time" id="officialTime"></div>
  <div class="time" id="deviceTime"></div>
  <div class="time" id="offsetTime"></div>

  <script src="../script-interfaz.js"></script>
  <script src="../script-eventos.js"></script>

<script src="script-extrabol.js"></script>

<script>

  /*====================*/
  /*==   JAVASCRIPT   ==*/
  /*====================*/
  const audio_news = document.getElementById('radio_news');
  const audio_prep = document.getElementById('radio_prep');
  const audio_music = document.getElementById('radio_music');

  const btn = document.getElementById('playButton');
  const imgLogo = document.getElementById('logo-emisora');

  let semaforo, interval;
  let fadeAudio_ID, fadeMusic_ID;

  let reconnectTimers = new Map();
  let reconnecting = new Set();

  let max_news_volume = 1.0;
  let max_music_volume = 0.5;

  let latencyInterval = null;

  function reconnectAudio(audio) {

    // Solo reconectar streams de radio
    if (audio !== audio_news && audio !== audio_music) return;

    // Si está pausado, probablemente lo hemos parado nosotros
    if (audio.paused) return;

    // Evitar varios intentos simultáneos
    if (reconnecting.has(audio)) return;

    reconnecting.add(audio);

    if (reconnectTimers.has(audio)) {
      clearTimeout(reconnectTimers.get(audio));
    }

    const timer = setTimeout(() => {

      // Puede haber sido detenido durante la espera
      if (audio.paused) {
        reconnecting.delete(audio);
        return;
      }

      const src = audio === audio_news ? streamURL : musicURL;

      if (!src || src === "none") {
        reconnecting.delete(audio);
        return;
      }

      console.log("🔄 Reconectando stream:", src);

      audio.pause();
      audio.removeAttribute("src");
      audio.load();

      audio.src = src;
      audio.load();

      audio.play().catch(err => {
        console.error("❌ Error al reconectar:", err);
      });

      reconnecting.delete(audio);

    }, 6000);

    reconnectTimers.set(audio, timer);
  }

  /*============================*/
  /*==  PARAMETROS DE LA URL  ==*/
  /*============================*/

  // URL por defecto
  let streamURL = "none";
  let musicURL = "none";

  // Leer parámetros de la URL
  const params = new URLSearchParams(window.location.search);
  const music = params.get("music");

  // Stream noticias
  streamURL = "https://playerservices.streamtheworld.com/api/livestream-redirect/CADENASER.mp3";

  imgLogo_news = "../resources/live/ser.png";
  imgLogo_pin = "../resources/live/pin.png";
  imgLogo.src = "../resources/live/off.png";
  
  // Elegir stream música según parámetro
  if (music === "2") { // ?music=2
    musicURL = "https://playerservices.streamtheworld.com/api/livestream-redirect/LOS40.mp3";
    imgLogo_music = "../resources/live/los40.png";
  } else if (music === "3") { // ?music=3
    musicURL = "https://playerservices.streamtheworld.com/api/livestream-redirect/LOS40_CLASSIC.mp3";
    imgLogo_music = "../resources/live/classic.png";
  } else if (music === "4") { // ?music=4
    musicURL = "https://megastar-cope-rrcast.flumotion.com/cope/megastar.mp3";
    imgLogo_music = "../resources/live/megastar.png";
  } else if (music === "5") { // ?music=5
    musicURL = "https://rockfm-cope-rrcast.flumotion.com/cope/rockfm.mp3";
    imgLogo_music = "../resources/live/rockfm.png";
  } else if (music === "6") { // ?music=6
    musicURL = "https://hitfm.kissfmradio.cires21.com/hitfm.mp3";
    imgLogo_music = "../resources/live/hitfm.png";
  } else {
    musicURL = "none";
  }
  /*=========================*/
  /*==   ASIGNAR LAS URL   ==*/
  /*=========================*/

  /* URL de las noticias*/
  console.log(streamURL);
  audio_news.src = streamURL;

  /* URL de la música */ 
  if (musicURL != "none"){
      console.log(musicURL);
      audio_music.src = musicURL;
  } else {
    // No hay música
    var slider = document.getElementById('radio_music_volume');
    slider.disabled = true;
    var st = document.getElementById('status_music');
    st.textContent = "Modo sin música";
  }

  /*================*/
  /*==  HORARIOS  ==*/
  /*================*/

  const horariosPermitidos = [
    { inicio: "07:58:30", fin: "08:20:18" },
    { inicio: "08:58:30", fin: "09:04:26" },
    { inicio: "09:58:30", fin: "10:05:54" },
    { inicio: "10:58:30", fin: "11:05:54" },
    { inicio: "11:58:30", fin: "12:20:18" },
    { inicio: "12:58:30", fin: "13:06:30" },
    { inicio: "13:58:30", fin: "14:06:26" },
    { inicio: "15:58:30", fin: "16:05:24" },
    { inicio: "16:58:30", fin: "17:05:24" },
    { inicio: "17:58:30", fin: "18:05:24" },
    { inicio: "18:58:30", fin: "19:04:32" },
    { inicio: "19:58:30", fin: "20:25:18" },
  ];

  const minuto_hardcode = 59; // 59
  const segundos_hardcode = 44; // 44
  const timetext = true; // Time console log

  /*=================================*/
  /*== FUNCIONES AUXILIARES SONIDO ==*/
  /*=================================*/

  // Fade in
  function fadeInVol(audioToFade, interval_ID, max_volume) {
    let suma = 0.06
    if (audioToFade.volume+suma < max_volume){
      audioToFade.volume += suma;
    }else{
      /*Hemos terminado*/
      audioToFade.volume = max_volume;
      clearInterval(interval_ID);
    }
  }

  // Fade out
  function fadeOutVol(audioToFade, interval_ID) {
    let resta = 0.06
    if (audioToFade.volume-resta > 0.0){
      audioToFade.volume -= resta;
    }else{
      /*Hemos terminado*/
      audioToFade.volume = 0.0;
      audioToFade.pause();
      clearInterval(interval_ID);
    }
  }

  // Pin de inicio de desconexión
  function desco_ini(){
    imgLogo.src = imgLogo_pin;
    audio_prep.volume = 1.0*max_news_volume;
    audio_prep.src = "../sounds/desco_ini_gen.mp3";
    audio_prep.play();
  }

  // Pin de fin de desconexión
  function desco_fin(){
    imgLogo.src = imgLogo_pin;
    audio_prep.volume = 0.7*max_news_volume;
    audio_prep.play();
  }

  // Función auxiliar
  function select_random_desco_fin(){
    let num_random_1 = Math.floor(Math.random() * 3);
    let num_random_2 = Math.floor(Math.random() * 4);

    if (music === "2" && num_random_1 == 0) {
      audio_prep.src = "../sounds/los40_a.mp3";
      return 32;
    } else if (music === "2" && num_random_1 == 1) {
      audio_prep.src = "../sounds/los40_b.mp3";
      return 28;
    } else if (music === "3" && num_random_1 !== 0) {
      audio_prep.src = "../sounds/los40c_a.mp3";
      return 10;
    } else if (num_random_2 == 0) {
      audio_prep.src = "../sounds/cortinilla_conversacion.mp3";
      return 15;
    } else if (num_random_2 == 1) {
      audio_prep.src = "../sounds/claim_corto.mp3";
      return 6;
    } else if (num_random_2 == 2) {
      audio_prep.src = "../sounds/radio_madrid.mp3";
      return 9;
    } else {
      audio_prep.src = "../sounds/desco_fin_hxh.mp3";
      return 5;
    }
  }

  // Pin generico
  function pin(){
    audio_prep.src = "../sounds/pin_noid.mp3";
    audio_prep.play();
  }

  

  /*=======================*/
  /*== FUNCION DIRECTORA ==*/
  /*=======================*/ 
  function actualizarReproduccion(safeMode=false) {

    const enHorario = estaEnHorario();

    if (enHorario && !semaforo && safeMode) {
      /** CARGA - PERIODO DE REPRODUCCIÓN **/

      // Noticias play
      play_news();
      
      // Intervalos rápidos
      clearInterval(interval);
      interval = setInterval(actualizarReproduccion, 1.0 * 1000);

    } else if (enHorario && !semaforo) {
      /** PERIODO DE REPRODUCCIÓN **/

      // Calculo delay
      hora = new Date();
      actual = hora.getMinutes()*60 + hora.getSeconds();
      objetivo = minuto_hardcode*60 + segundos_hardcode;
      delaysecs = objetivo - actual;

      // Noticias play
      play_news(delaysecs * 1000);

      if (delaysecs-3.0 > 0) {
        /// Fade out música + pin
        stop_music( (delaysecs-4.0) * 1000 );
        setTimeout( () => { desco_ini(); }, (delaysecs-3.0) * 1000 );
      } else {
        // No da tiempo, paro musica
        stop_music();
      }

      // Intervalos rápidos
      clearInterval(interval);
      interval = setInterval(actualizarReproduccion, 1.0 * 1000);

    } else if (!enHorario && semaforo && safeMode) {
      /** CARGA - PERIODO DE ESPERA **/

      // Música play
      play_music();

      // Otros
      semaforo = false;
      btn.style.background = '#1a73e8';
      btn.textContent = "Fuera del horario de noticias";
      console.log("Transmisión desactivada");

      // Intervalos relajados
      console.log("== 3. Iniciando bucle ==");
      interval = setInterval(actualizarReproduccion, 20.0 * 1000);     

    } else if (!enHorario && semaforo) {
      /** PERIODO DE ESPERA **/

      // Noticias stop
      stop_news();

      // Pin desco (incluye llamada a play music)
      let t_desco_ini_aux = select_random_desco_fin();
      setTimeout(() => { desco_fin();}, 2.0 * 1000);
      setTimeout(() => { play_music(); }, t_desco_ini_aux * 1000);

      // Otros          
      semaforo = false;
      btn.style.background = '#1a73e8';
      btn.textContent = "Fuera del horario";
      console.log("Transmisión desactivada");

      // Intervalos relajados
      clearInterval(interval);
      interval = setInterval(actualizarReproduccion, 20.0 * 1000);

    } 
  }

  /*===========================*/
  /*==   PLAY / STOP AUDIO   ==*/
  /*===========================*/

  /* Reproducir noticias */
  function play_news(delay=0) {

    audio_news.volume = 0.01;
    audio_news.load();
    audio_news.play().catch(err => console.error("Error al reproducir:", err));

    clearInterval(latencyInterval);

    // Control para evitar que el streaming de audio clásico se quede retrasado
    latencyInterval = setInterval(() => {
      if (!audio_news.paused && audio_news.buffered.length > 0) {
        const livePosition = audio_news.buffered.end(audio_news.buffered.length - 1);
        const margenSegundos = livePosition - audio_news.currentTime;

        console.log(`Margen con el directo: ${margenSegundos.toFixed(2)} segundos`);

        // Si el retraso acumulado supera los 4 segundos, saltamos al borde actual
        if (livePosition - audio_news.currentTime > 4) {
          audio_news.currentTime = livePosition;
        }
      }
    }, 10000);

    semaforo = true;

    if (delay>0.0){
      // Otros cuando hay delay
      btn.style.background = 'brown';
      btn.textContent = "Transmisión de noticias preparada";
      console.log("Transmisión preparada");
    } 
 
    setTimeout(() => {
      // El fade in lleva retraso
      fadeAudio_ID = setInterval(() => {fadeInVol(audio_news, fadeAudio_ID, max_news_volume);}, 100);

      // Otros definitivo
      imgLogo.src = imgLogo_news;
      btn.style.background = 'green';
      btn.textContent = "Trasmitiendo noticias en directo";
      console.log("Transmisión activada");
    }, delay);

  }

  /* Parar noticias */
  function stop_news(){
    fadeAudio_ID = setInterval(() => {fadeOutVol(audio_news, fadeAudio_ID);}, 150);
  }

  /* Reproducir música */
  function play_music() {
    if (musicURL != "none"){
      // Reiniciar con fade in
      imgLogo.src = imgLogo_music;
      imgLogo.classList.add('logo-sonando');
      audio_music.volume = 0.01;
      audio_music.load();
      audio_music.play().catch(err => console.error("Error al reproducir:", err));
      fadeMusic_ID = setInterval(() => {fadeInVol(audio_music, fadeMusic_ID, max_music_volume);}, 300);

      clearInterval(latencyInterval);

      // Control para evitar que el streaming de audio clásico se quede retrasado
      latencyInterval = setInterval(() => {
        if (!audio_music.paused && audio_music.buffered.length > 0) {
          const livePosition = audio_music.buffered.end(audio_music.buffered.length - 1);
          const margenSegundos = livePosition - audio_music.currentTime;

          console.log(`Margen con el directo: ${margenSegundos.toFixed(2)} segundos`);

          // Si el retraso acumulado supera los 4 segundos, saltamos al borde actual
          if (livePosition - audio_music.currentTime > 4) {
            audio_music.currentTime = livePosition;
          }
        }
      }, 10000);
    }
  }

  /* Parar música */
  function stop_music(delay=0) {
    if (musicURL != "none"){
      // Para con delay opcional
      setTimeout(() => {
        imgLogo.classList.remove('logo-sonando');
        fadeMusic_ID = setInterval(() => {fadeOutVol(audio_music, fadeMusic_ID);}, 100);
      }, delay);
    }
  }
  
  /*===========================*/
  /*==    MAIN FUNCTION      ==*/
  /*===========================*/

  // La llamada está en el listerner del botón "btn"
  function main_function () {
    console.log("== 1. Definiendo semaforo ==");
    semaforo = estaEnHorario() ? false : true;
    console.log("Semaforo " + semaforo);

    console.log("== 2. Comprobación inicial ==");
    actualizarReproduccion(true);  
  }

  /*================================*/
  /*== RECONEXIÓN DE LOS STREAMS ==*/
  /*================================*/

  [audio_news, audio_music].forEach(audio => {

    audio.addEventListener("error", () => {
      console.log("⚠️ Error en stream");
      reconnectAudio(audio);
    });

    audio.addEventListener("ended", () => {
      console.log("⚠️ Stream terminado");
      reconnectAudio(audio);
    });

    audio.addEventListener("stalled", () => {
      console.log("⚠️ Stream detenido");
      reconnectAudio(audio);
    });

  });

  /*===========================*/
  /*==  INTERACCIÓN USUARIO  ==*/
  /*===========================*/
  

  // Pulsar el botón para empezar
  btn.textContent = "Haz click aquí para otorgar permisos";
  btn.addEventListener('click', () => {
    setupVisualizer();
    pin();
    setTimeout(() => { main_function(); }, 1200);
  },{once:true});
  



  // Iniciar
  obtenerHoraOficial();

  // Actualizar cada segundo
  setInterval(actualizarRelojes, 1000);

  // Refrescar hora oficial dos minuto
  setInterval(obtenerHoraOficial, 2*60000);

</script>

      imgLogo.style.setProperty('--bounce-scale', randomScale);

</script>

</body>
