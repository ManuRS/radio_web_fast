<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Página no encontrada · Radio Web Fast</title>
  <meta name="robots" content="noindex">

  <!-- Esta página se sirve en cualquier ruta que no existe, a cualquier profundidad
       (/a, /a/b/c…): por eso no carga ningún archivo externo, todo va aquí dentro. -->
  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: light;
      --fondo: linear-gradient(160deg, #f6f6f6, #f4f4f4);
      --texto: #333;
      --titulo: #2d3748;
      --secundario: gray;
      --boton: #f0f0f0;
      --boton-hover: #ddd;
      --boton-texto: #333;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --fondo: linear-gradient(160deg, #111827, #1b263b);
      --texto: #e5e7eb;
      --titulo: #e2e8f0;
      --secundario: #b0b8c5;
      --boton: #293548;
      --boton-hover: #3b4b66;
      --boton-texto: #e5e7eb;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--fondo);
      color: var(--texto);
    }

    .codigo {
      margin: 0;
      font-size: 5rem;
      font-weight: 700;
      line-height: 1;
      color: var(--titulo);
    }

    h1 {
      margin: 12px 0 0;
      font-size: 1.5rem;
      color: var(--titulo);
    }

    p {
      margin: 12px 0 28px;
      color: var(--secundario);
    }

    a {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 999px;
      background: var(--boton);
      color: var(--boton-texto);
      text-decoration: none;
      font-size: 1rem;
    }
    a:hover, a:focus-visible { background: var(--boton-hover); }
  </style>

  <script>
    // Mismo tema que el resto de la app (se guarda con esta clave); si no hay ninguno, el del sistema.
    try {
      var tema = localStorage.getItem('radio-page-theme');
      if (tema !== 'dark' && tema !== 'light') {
        tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = tema;
    } catch (error) {
      // Sin almacenamiento, se queda en claro.
    }
  </script>
</head>

<body>
  <p class="codigo" aria-hidden="true">404</p>
  <h1>Página no encontrada</h1>
  <p>La dirección no existe o ha cambiado de sitio</p>
  <a id="inicio" href="https://radioes.pages.dev/">Ir a Radio Web Fast</a>

  <script>
    // En GitHub Pages la app vive en una carpeta (manurs.github.io/radio_web_fast/): se vuelve a ella, no a Cloudflare.
    if (/\.github\.io$/.test(location.hostname)) {
      var carpeta = location.pathname.split('/')[1];
      if (carpeta) document.getElementById('inicio').href = '/' + carpeta + '/';
    }
  </script>
</body>
</html>
