<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <link rel="icon" href="../resources/favicon2.ico" type="image/x-icon">
  <link rel="shortcut icon" href="../resources/favicon2.ico" type="image/x-icon">

  <meta name="theme-color" content="#f6f6f6" id="theme-color-meta">
  
  <title>Pódcast entretenimiento</title>

<body>

  <h1>Entretenimiento<br><br></h1>

  <!-- Control de volumen, define su posición -->
  <div class="volume-control">
    <input type="range" id="volume-slider" min="0.001" max="1" step="any" value="1">
  </div>

  <!-- Botón modo oscuro, la posición no se define aquí -->
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Activar modo oscuro" aria-pressed="false">
    <span id="theme-label">Modo oscuro</span>
    <span id="theme-icon" aria-hidden="true">🌙</span>
  </button>

  <!-- Modal de salida: botón atrás tras dar al play (ver script-interfaz.js) -->
  <dialog id="exit-modal" class="info-dialog" aria-labelledby="exit-title">
    <div class="modal-content info-content">
      <button type="button" class="info-close" id="exit-close" aria-label="Cerrar">✕</button>
      <div class="info-head">
        <img src="../resources/icon2-192.png" alt="" width="28" height="28">
        <h2>Radio Web Fast</h2>
      </div>
      <p class="exit-q" id="exit-title">¿Salir y parar el podcast?</p>
      <p class="exit-note" id="exit-note">Para seguir escuchando, minimiza la app con el botón de inicio</p>
      <div class="exit-actions">
        <button type="button" id="exit-cancel" autofocus>Cancelar</button>
        <button type="button" id="exit-go" class="primario">Sí, salir</button>
      </div>
    </div>
  </dialog>
