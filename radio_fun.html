<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pódcast en línea</title>

  <script src="script-fastload.js"></script>

  <link rel="stylesheet" href="theme-colors.css">
  <link rel="stylesheet" href="theme-podcast.css">
  <link rel="stylesheet" href="theme-aux.css">

</head>

<body>

  <h1>Pódcast en línea<br><br></h1>

  <!-- Control de volumen, define su posición -->
  <div class="volume-control">
    <input type="range" id="volume-slider" min="0.001" max="1" step="any" value="1">
  </div>

  <!-- Botón modo oscuro, la posición no se define aquí -->
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Activar modo oscuro" aria-pressed="false">
    <span id="theme-label">Modo oscuro</span>
    <span id="theme-icon" aria-hidden="true">🌙</span>
  </button>

  <!-- Modal salir, la posición no se define aquí -->
  <div id="exit-modal" class="modal">
    <div class="modal-content">
      <p><b>Pulsa atrás / desliza de nuevo para salir</b></p>
      <div class="buttons">
        <button id="stay-btn">Seguir en la página</button>
      </div>
    </div>
  </div>

  <br><br>

  <div id="lista"></div>

  <script src="script-logica.js"></script>
  <script src="script-interfaz.js"></script>

  <script>

    const podcasts = [
      { nombre: "Recarga Activa", url: "https://feeds.megaphone.fm/ANAITMEDIASL2541363674", capitulo: [": "] },
      { nombre: "Podcasts Reload", url: "https://feeds.megaphone.fm/ANAITMEDIASL8877538750", capitulo: ["Podcast Reload: "] },

      { nombre: "NørdicWire", url: "https://www.nordicwire.com/feed/podcast/", capitulo: [" "] },
      { nombre: "3PAX", url: "https://anchor.fm/s/11821af84/podcast/rss", capitulo: [" "] },

      { nombre: "Unidad de Vigilancia", url: "https://fapi-top.prisasd.com/podcast/playser/la_ventana/itunestfp/podcast.xml", capitulo: ["Unidad de vigilancia | "] },
      { nombre: "Nadie Sabe Nada", url: "https://fapi-top.prisasd.com/podcast/playser/nadie_sabe_nada/itunestfp/podcast.xml", capitulo: ["Nadie Sabe Nada"] },
      { nombre: "Las Noches de Ortega", url: "https://fapi-top.prisasd.com/api/v2/feed-rss/playser/las-noches-de-ortega/itunestfp", capitulo: ["Las Noches de Ortega"] },
      
      { nombre: "Del 40 al 1 - 10H", url: "https://fapi-top.prisasd.com/podcast/los40/del_40_al_1_completo/itunestfp/podcast.xml", capitulo: ["10-11h"] },
      { nombre: "Del 40 al 1 - 11H", url: "https://fapi-top.prisasd.com/podcast/los40/del_40_al_1_completo/itunestfp/podcast.xml", capitulo: ["11-12h"] },
      { nombre: "Del 40 al 1 - 12H", url: "https://fapi-top.prisasd.com/podcast/los40/del_40_al_1_completo/itunestfp/podcast.xml", capitulo: ["12-13h"] },
      { nombre: "Del 40 al 1 - 13H", url: "https://fapi-top.prisasd.com/podcast/los40/del_40_al_1_completo/itunestfp/podcast.xml", capitulo: ["13-14h"] },
      { nombre: "Del 40 al 1 - 14H", url: "https://fapi-top.prisasd.com/podcast/los40/del_40_al_1_completo/itunestfp/podcast.xml", capitulo: ["14-14"] },
    ];

    const listaDiv = document.getElementById("lista");
    const contenedores = podcasts.map(() => {
      const div = document.createElement("div");
      div.className = "podcast";
      listaDiv.appendChild(div);
      return div;
    });

    podcasts.forEach((p, index) => cargarRSS(p, contenedores[index]));

    async function cargarRSS(p, contenedor) {
      try {
        const res = await fetch(p.url);
        const texto = await res.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(texto, "application/xml");

        const items = xml.querySelectorAll("item");
        let audioUrl = null;
        let tituloEncontrado = null;
        let pubDateEncontrado = null;

        imageUrlElement = null;
        imageUrl = null;
        htmlImagen = null;

        for (const item of items) {
          const titulo = item.querySelector("title")?.textContent || "";
          if (p.capitulo.some(c => titulo.includes(c))) {
            tituloEncontrado = titulo;
            pubDateEncontrado = item.querySelector("pubDate")?.textContent || null;
            const enclosure = item.querySelector("enclosure");
            if (enclosure) audioUrl = enclosure.getAttribute("url");

            if (!tituloEncontrado.includes("Del 40 al 1")){
              imageUrlElement = item.getElementsByTagName('itunes:image')[0];
              imageUrl = imageUrlElement ? imageUrlElement.getAttribute('href') : null;
              htmlImagen = imageUrl ? `<img src="${imageUrl}" alt="${p.nombre}">` : "";
            }else{
              imageUrlElement = xml.getElementsByTagName('itunes:image')[0];
              imageUrl = imageUrlElement ? imageUrlElement.getAttribute('href') : null;
              htmlImagen = imageUrl ? `<img src="${imageUrl}" alt="${p.nombre}">` : "";
            }

            break;
          }
        }

        //imageUrl = xml.querySelector("image > url")?.textContent || null;
        //htmlImagen = imageUrl ? `<img src="${imageUrl}" alt="${p.nombre}">` : "";

        //imageUrlElement = xml.getElementsByTagName('itunes:image')[0];
        //imageUrl = imageUrlElement ? imageUrlElement.getAttribute('href') : null;
        //htmlImagen = imageUrl ? `<img src="${imageUrl}" alt="${p.nombre}">` : "";

        if (audioUrl) {
          const tiempo = pubDateEncontrado ? tiempoDesde(pubDateEncontrado) : "";
          const fechaFormateada = pubDateEncontrado ? formatearFecha(pubDateEncontrado) : "";

          contenedor.innerHTML = `
            <div class="podcast-contenido">
              ${htmlImagen}
              <div class="podcast-texto">
                <p class="titulo-principal" style="display:inline">${p.nombre} / ${tiempo}</p><br><br>
                <p class="titulo-secundario" style="display:inline">${tituloEncontrado}</p>
                <br><br>
                <audio controls style="background-color: var(--audio-background, #f1f3f4);" src="${audioUrl}"></audio>
                <div class="controles">
                  <div class="botones-reproduccion">
                  <button onclick="
                      let a=this.closest('.podcast-texto').querySelector('audio');
                      if(a.paused){ a.play(); this.textContent='🔴 Pausa'; }
                      else { a.pause(); this.textContent='🟢 Play'; }
                  ">🟢 Play</button>
                  <button onclick="let a=this.closest('.podcast-texto').querySelector('audio'); a.currentTime = Math.max(0,a.currentTime-10)">⏪ -10s</button>
                  <button onclick="let a=this.closest('.podcast-texto').querySelector('audio'); a.currentTime = Math.min(a.duration,a.currentTime+10)">⏩ +10s</button>
                  <button onclick="let a=this.closest('.podcast-texto').querySelector('audio'); a.playbackRate=a.playbackRate===1?2:1;this.textContent=a.playbackRate===2?'⏩ x1':'⏩ x2'">⏩ x2</button>
                  </div>
                </div>
              </div>
            </div>
          `;

          contenedor.innerHTML = contenedor.innerHTML + '<br>'

        } else {
          contenedor.innerHTML = `<p class="titulo-principal">${p.nombre} (No se encontró el capítulo "${p.capitulo}")</p>`;
        }

      } catch (e) {
        console.error("Error cargando RSS:", e);
      }
    }

  </script>

</body>
</html>
