<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa de emisoras de la SER</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />


  <style>
    body { margin: 0; padding: 0; }
    #map { height: 100vh; width: 100%; background: #111827;}

    /* Panel lateral flotante */
    #panel {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 250px;
      max-width: 80%;
      background: rgba(255, 255, 255, 0.9);
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      z-index: 1000;
      font-family: Arial, sans-serif;
    }

    #panel h1 {
      margin: 0;
      font-size: 18px;
      text-align: center;
    }

    /* Ajustes para móviles */
    @media (max-width: 600px) {

      /* Cartel del título */
      #panel {
        top: 12px;
        left: 12px;
        width: 200px;
        max-width: calc(100% - 48px);
        padding: 16px;
        border-radius: 12px;
      }

      #panel h1 {
        font-size: 16px;
        line-height: 1.35;
      }

        /* Botones de zoom */
      .leaflet-control-zoom a {
        width: 44px;
        height: 44px;
        line-height: 44px;
        font-size: 28px;
      }
      /* Ventana que aparece al pulsar una emisora */
      .leaflet-popup-content {
        font-size: 16px;
        line-height: 1.6;
        margin: 16px 20px;
      }

      .leaflet-popup-content-wrapper {
        border-radius: 12px;
      }

      .leaflet-popup-content b {
        font-size: 20px;
      }

      .leaflet-popup-close-button {
        transform: scale(1.3);
        transform-origin: top right;
      }

      /* Iconos de los marcadores de las emisoras */
      .leaflet-marker-icon {
        transform-origin: center bottom;
      }
    }

  </style>
  
</head>

<body>

  <!-- Panel lateral flotante -->
  <div id="panel">
    <h1>MAPA DE LA RED DE EMISORAS DE LA SER</h1>
  </div>

  <!-- Mapa -->
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>

    // Centrar el mapa en España
    var map = L.map('map', {
      minZoom: 4,   // Zoom mínimo
      maxZoom: 12,   // Zoom máximo
      zoomControl: false // Desactivamos zoom por defecto
    }).setView(
      [40.0, -3.8],
      window.matchMedia('(max-width: 600px)').matches ? 6 : 7
    );

    // Colocar control de zoom en la esquina superior derecha
    L.control.zoom({ position: 'topright' }).addTo(map);

    // Capa base
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      subdomains: 'abc',
    }).addTo(map);

    // Descargar el json eliminando los comentarios
    fetch('https://raw.githubusercontent.com/ManuRS/radio_web_fast/refs/heads/main/extra_emisorasser.json')
      .then(r => r.text())
      .then(texto => {
        const textoLimpio = texto.replace(/\/\/.*$/gm, '');
        const emisoras = JSON.parse(textoLimpio);

        // Añadir marcadores de emisoras
        emisoras.forEach(function(emisora) {
          L.marker([emisora.lat, emisora.lon])
            .addTo(map)
            .bindPopup('<b>' + emisora.nombre + '</b><br>' + emisora.ciudad + '<br>Frecuencia: ' + emisora.frecuencia);
        });
      })
    .catch(error => console.error('Error al cargar las emisoras:', error));

  </script>

</body>

</html>
