<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pódcast de diarios</title>

  <script src="theme-fastload.js"></script>

  <link rel="stylesheet" href="theme-colors.css">
  <link rel="stylesheet" href="theme-podcast.css">
  <link rel="stylesheet" href="theme-styles.css">
  
</head>

<body>

  <h1>Pódcast de diarios<br><br></h1>

  <!-- Control de volumen -->
  <div class="volume-control">
    <input type="range" id="volume-slider" min="0.001" max="1" step="any" value="1">
  </div>

  <br><br>

  <div id="lista"></div>

  <script>

    async function cargarRSS(feedUrl_arg) {
      try {
        const res = await fetch(feedUrl_arg);
        const texto = await res.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(texto, "application/xml");

        const items = Array.from(xml.querySelectorAll("item")).slice(0, 2); // últimos 30

        const imageUrl = xml.querySelector("image > url")?.textContent || null;
        const htmlImagen = imageUrl ? `<img src="${imageUrl}" alt="Podcast">` : "";

        const listaDiv = document.getElementById("lista");

        items.forEach(item => {
          const titulo = item.querySelector("title")?.textContent || "Sin título";
          const pubDate = item.querySelector("pubDate")?.textContent || null;
          const audioUrl = item.querySelector("enclosure")?.getAttribute("url") || null;

          const contenedor = document.createElement("div");
          contenedor.className = "podcast";

          if (audioUrl) {
            contenedor.innerHTML = `
              <div class="podcast-contenido">
                ${htmlImagen}
                <div class="podcast-texto">
                  <p class="titulo-principal">${titulo}</p>
                  <br>
                  <audio controls style="background-color: var(--audio-background, #f1f3f4);" src="${audioUrl}"></audio>
                  <div class="controles">
                    <div class="botones-reproduccion">
                    <button onclick="
                        let a=this.closest('.podcast-texto').querySelector('audio');
                        if(a.paused){ a.play(); this.textContent='⏸ Pausa'; }
                        else { a.pause(); this.textContent='▶ Play'; }
                    ">▶ Play</button>
                    <button onclick="let a=this.closest('.podcast-texto').querySelector('audio'); a.currentTime = Math.max(0,a.currentTime-10)">⏪ -10s</button>
                    <button onclick="let a=this.closest('.podcast-texto').querySelector('audio'); a.currentTime = Math.min(a.duration,a.currentTime+10)">⏩ +10s</button>
                    <button onclick="let a=this.closest('.podcast-texto').querySelector('audio'); a.playbackRate=a.playbackRate===1?2:1;this.textContent=a.playbackRate===2?'⏸ x1':'⏩ x2'">⏩ x2</button>
                    </div>
                  </div>
                </div>
              </div>
              <br>
            `;
          } else {
            contenedor.innerHTML = `<p class="titulo-principal">${titulo} (No se encontró audio)</p>`;
          }

          // AL CARGAR UN NUEVO AUDIO, LE ASIGNAMOS EL VOLUMEN ACTUAL DEL SLIDER GLOBAL
          const nuevoAudio = contenedor.querySelector("audio");
          if (nuevoAudio) {
            nuevoAudio.volume = document.getElementById("volume-slider").value;;
          }

          listaDiv.appendChild(contenedor);
        });

      } catch(e) {
        console.error("Error cargando RSS:", e);
      }
    }

    // EL PAIS
    setTimeout(function() {
            cargarRSS("https://www.omnycontent.com/d/playlist/26708dff-8243-49e4-a5b6-adb700ec9cae/a7906eb0-d14b-4bc1-a048-ae30009a0e51/3ec1b1fa-5520-4b11-b8f2-ae30009a0e77/podcast.rss");
    },0);

    // EL DIARIO ES
    setTimeout(function() {
            cargarRSS("https://www.omnycontent.com/d/playlist/554539c9-b3b2-431a-9f3a-ada4006d04a0/fdb7ac24-1c3a-4a0d-b03b-ada400b2e7a1/161b26db-5f85-42a9-abc8-ada6008a528b/podcast.rss");
    },500);

    // EL MUNDO
    setTimeout(function() {
            cargarRSS("https://test.cors.workers.dev/?https://feeds.acast.com/public/shows/69e1e5256e5b90839adefeaf");
    },1000);

  </script>

  <!-- Botón modo oscuro -->
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Activar modo oscuro" aria-pressed="false">
    <span id="theme-label">Modo oscuro</span>
    <span id="theme-icon" aria-hidden="true">🌙</span>
  </button>

  <!-- Modal salir -->
  <div id="exit-modal" class="modal">
    <div class="modal-content">
      <p><b>Pulsa atrás / desliza de nuevo para salir</b></p>
      <div class="buttons">
        <button id="stay-btn">Seguir en la página</button>
      </div>
    </div>
  </div>

  <script src="theme-scripts.js"></script>

</body>
</html>
